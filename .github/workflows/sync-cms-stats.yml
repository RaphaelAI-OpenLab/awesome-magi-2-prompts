name: Sync CMS statistics

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-readme-stats
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync MAGI-2 CMS total and timestamp
        env:
          CMS_BASE_URL: ${{ vars.CMS_BASE_URL }}
          CMS_READ_TOKEN: ${{ secrets.CMS_READ_TOKEN }}
        run: python3 scripts/sync_cms_stats.py
      - name: Check generated pages
        run: python3 scripts/build_readme.py --check
      - name: Commit statistics
        run: |
          git add -- README.md README.zh-CN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync CMS statistics'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
