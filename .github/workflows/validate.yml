name: Validate collection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data, media limits, and local links
        run: python3 scripts/validate.py
      - name: Check generated READMEs and badges
        run: python3 scripts/build_readme.py --check
      - name: Build GitHub Pages check
        run: python3 scripts/build_pages.py --out _site
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
