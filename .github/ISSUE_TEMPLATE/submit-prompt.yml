name: Submit a MAGI-2 prompt / 提交 MAGI-2 提示词案例
description: Suggest a real MAGI-2 or MAGI-2-preview example with its short/structured prompt, omni-references, and playable video source.
title: "[Prompt] "
body:
  - type: markdown
    attributes:
      value: |
        Include the original source URL and distinguish your own test from a collected example. Never upload large MP4 files directly to Git; share the official/source video URL or R2 link plus an optional lightweight (<500 KB) frame preview.
        请附原始来源链接，并区分自己实际生成的结果与收集到的案例。请勿在仓库内提交大体积 MP4 视频，提供官方/原帖或 R2 视频链接及轻量封面图（<500 KB）即可。
  - type: input
    id: title
    attributes:
      label: Case title / 案例标题
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Original source URL / 原帖或官方示例链接
      description: For your own unpublished work, state that it is original in the notes below.
  - type: input
    id: author
    attributes:
      label: Creator credit / 原作者署名
    validations:
      required: true
  - type: dropdown
    id: model_variant
    attributes:
      label: Model variant / 模型版本
      options:
        - MAGI-2 (Flagship)
        - MAGI-2-preview (Open-weights 114B/6B)
        - MAGI-2 — variant unspecified / 未注明版本
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task type / 任务类型
      options:
        - Text-to-Video (T2V)
        - Image-to-Video (I2V)
        - Omni-Reference (Mixed image/video/audio)
    validations:
      required: true
  - type: textarea
    id: short_prompt
    attributes:
      label: Short prompt / 一句话提示词
      render: text
    validations:
      required: true
  - type: textarea
    id: structured_prompt
    attributes:
      label: Structured PE prompt or shot timeline (optional) / 结构化 PE 或分镜时间轴（选填）
      description: Paste MAGI-2 PE JSON (global_layer / dynamic_layer or shot_timeline) or timestamped dialogue & SFX notes if available.
      render: json
  - type: textarea
    id: media
    attributes:
      label: Video URL, audio notes & omni-references / 视频链接、音频与参考素材
      description: Share playable MP4 source link, duration, resolution, dialogue/SFX notes, and required reference images/clips/audio.
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Verification / 实测状态
      options:
        - Collected from source; not independently tested / 仅收集
        - Reproduced or generated by contributor / 已实际复现或原创实测
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Attribution and reuse terms / 署名与使用条件
      description: State whether this is original, permitted, licensed, or link-only. Attribution alone is not a license.
    validations:
      required: true
