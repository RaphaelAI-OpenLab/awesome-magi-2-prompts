  <text x="64" y="405" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.4">Copy short prompts or structured PE timelines. Keep playable video sources outside Git.</text>
  <text x="1375" y="405" fill="#64748b" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">CURATED BY RAPHAEL</text>
